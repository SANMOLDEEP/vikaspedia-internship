spring:
  application:
    name: keywordgenerator
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  h2:
    console:
      enabled: true
  cache:
    type: redis
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      time-to-live: 600000

server:
  port: 8080

logging:
  level:
    com.seo.keywordgenerator: DEBUG
    org.springframework.cache: DEBUG

app:
  trends:
    cache-ttl-real-time: PT6H
    cache-ttl-pytrends: PT24H
    autocomplete:
      rate-limit-per-minute: 10
      timeout-ms: 1500

scheduler:
  trending:
    enabled: true
    cron: "0 0 2 * * *"
    cache-duration: PT24H
    max-keywords: 100
    pytrends-batch-size: 3
    pytrends-sleep-seconds: "8.0"
    python-command: python
    pytrends-script: backend/scripts/pytrends_prefetch.py
